unbind C-b
set -g prefix C-q
bind C-q send-prefix

set-option -g mouse on
# vimのキーバインドでペインを移動します。
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind | split-window -h
bind v split-window -v
bind s choose-tree -Zw
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

# コピーモードを vim のキー操作にする
setw -g mode-keys vi
# コマンドプロンプト (prefix + :) も vi 操作にする。
# 明示しないと tmux が $EDITOR / $VISUAL の中身から推測するので、環境依存になる。
set -g status-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle

# y でシステムクリップボードにもコピーする (macOS: pbcopy, Linux: wl-copy/xclip)
if-shell "uname | grep -q Darwin" \
  "bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy'"
if-shell "uname | grep -q Linux" \
  "bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'command -v wl-copy > /dev/null 2>&1 && wl-copy || xclip -selection clipboard -in'"

# 環境依存の設定 (default-shell の store パスなど) は Home Manager が
# ~/.config/tmux/nix.conf として生成する (nix/home/tmux.nix)。後勝ちにしたいので末尾で読む。
# Nix を使わない環境ではファイルが無いので -q でエラーを抑止する。
source-file -q ~/.config/tmux/nix.conf
