unbind C-b
set -g prefix C-q
bind C-q send-prefix

set-option -g mouse on
# vimのキーバインドでペインを移動します。
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind | split-window -h
bind v split-window -v
bind s choose-tree -Zw
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# コピーモードを vim のキー操作にする
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle

# y でシステムクリップボードにもコピーする (macOS: pbcopy, Linux: wl-copy/xclip)
if-shell "uname | grep -q Darwin" \
  "bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy'"
if-shell "uname | grep -q Linux" \
  "bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'command -v wl-copy > /dev/null 2>&1 && wl-copy || xclip -selection clipboard -in'"
